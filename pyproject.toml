[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "reel-connections"
version = "2.0.0"
description = "An interactive Six Degrees of Kevin Bacon game using IMDb data."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "pandas",
    "numpy",
    "streamlit>=1.60.0",
    "pyarrow==23.0.1",
]

[project.optional-dependencies]
dev = [
    "pylint",
    "coverage",
]

[tool.setuptools.packages.find]
where = ["streamlit"]

[tool.coverage.run]
source = ["streamlit/core"]

[tool.coverage.report]
show_missing = true
